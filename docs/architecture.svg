<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#82817b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1baf7a"/>
    </marker>
  </defs>
  <style>
    .surface{fill:#fcfcfb;stroke:#e2e1dc}
    .panel{fill:#f4f4f2;stroke:#e2e1dc}
    .t{fill:#0b0b0b;font-size:13px}
    .tb{fill:#0b0b0b;font-size:14px;font-weight:650}
    .ts{fill:#52514e;font-size:11.5px}
    .tm{fill:#82817b;font-size:11px}
    .ln{stroke:#82817b;stroke-width:1.6;fill:none}
    .lnag{stroke:#1baf7a;stroke-width:2;fill:none}
    .hdr{font-size:11px;fill:#82817b;letter-spacing:.08em}
  </style>

  <rect width="1180" height="760" fill="#fcfcfb"/>
  <text x="32" y="38" class="tb" font-size="19">Agentic GraphRAG on TigerGraph — system architecture</text>
  <text x="32" y="58" class="ts">One corpus, one graph, one tool layer, three pipelines, one benchmark.</text>

  <!-- INGESTION -->
  <text x="32" y="92" class="hdr">INGESTION (offline, once)</text>
  <rect x="32" y="102" width="200" height="72" rx="10" class="surface"/>
  <text x="46" y="126" class="tb">corpus.jsonl</text>
  <text x="46" y="144" class="ts">2,951 Wikipedia docs</text>
  <text x="46" y="160" class="ts">2,162 Olympic events + 789 distractors</text>

  <rect x="262" y="102" width="212" height="72" rx="10" class="surface"/>
  <text x="276" y="126" class="tb">Infobox parser</text>
  <text x="276" y="144" class="ts">typed fields, medal splitting,</text>
  <text x="276" y="160" class="ts">normalisation (68kg / +80 kg / dashes)</text>

  <rect x="504" y="102" width="196" height="72" rx="10" class="surface"/>
  <text x="518" y="126" class="tb">Chunker + embedder</text>
  <text x="518" y="144" class="ts">23,497 chunks</text>
  <text x="518" y="160" class="ts">all-MiniLM-L6-v2 (384-d)</text>

  <line x1="232" y1="138" x2="258" y2="138" class="ln" marker-end="url(#a)"/>
  <line x1="474" y1="138" x2="500" y2="138" class="ln" marker-end="url(#a)"/>

  <!-- TIGERGRAPH -->
  <rect x="730" y="92" width="418" height="200" rx="12" class="panel"/>
  <text x="748" y="116" class="hdr">TIGERGRAPH SAVANNA</text>
  <rect x="748" y="128" width="190" height="146" rx="10" class="surface"/>
  <text x="762" y="150" class="tb">Property graph</text>
  <text x="762" y="170" class="ts">Event · Games · Sport · Venue</text>
  <text x="762" y="186" class="ts">Athlete · Nation · Document</text>
  <text x="762" y="208" class="tm">IN_SPORT · AT_GAMES</text>
  <text x="762" y="224" class="tm">HELD_AT · WON_MEDAL · REPRESENTS</text>
  <text x="762" y="240" class="tm">PRECEDES (temporal hop)</text>
  <text x="762" y="262" class="ts">9 installed GSQL queries</text>

  <rect x="954" y="128" width="182" height="146" rx="10" class="surface"/>
  <text x="968" y="150" class="tb">Vector DB</text>
  <text x="968" y="170" class="ts">Chunk.chunk_emb</text>
  <text x="968" y="186" class="ts">HNSW · cosine</text>
  <text x="968" y="214" class="tm">Semantic search over</text>
  <text x="968" y="230" class="tm">unstructured passages</text>

  <line x1="700" y1="138" x2="726" y2="138" class="ln" marker-end="url(#a)"/>
  <path d="M470 174 C 470 230, 620 230, 726 200" class="ln" marker-end="url(#a)"/>

  <!-- TOOL LAYER -->
  <text x="32" y="330" class="hdr">SHARED TOOL LAYER — identical for all three pipelines</text>
  <rect x="32" y="340" width="1116" height="66" rx="10" class="surface"/>
  <text x="48" y="364" class="t">link_event</text>
  <text x="48" y="382" class="tm">entity linking</text>
  <text x="188" y="364" class="t">events_at_venue_on_date</text>
  <text x="188" y="382" class="tm">graph traversal</text>
  <text x="392" y="364" class="t">get_medalists</text>
  <text x="392" y="382" class="tm">graph traversal</text>
  <text x="530" y="364" class="t">previous_games_event</text>
  <text x="530" y="382" class="tm">multi-hop / temporal</text>
  <text x="712" y="364" class="t">count_events · top_event</text>
  <text x="712" y="382" class="tm">exact aggregation in-graph</text>
  <text x="916" y="364" class="t">similarity_search</text>
  <text x="916" y="382" class="tm">vector</text>
  <text x="1036" y="364" class="t">read_document</text>
  <text x="1036" y="382" class="tm">expensive</text>

  <line x1="590" y1="292" x2="590" y2="336" class="ln" marker-end="url(#a)"/>

  <!-- PIPELINES -->
  <text x="32" y="446" class="hdr">THREE PIPELINES — same question, same tools, different control flow</text>

  <rect x="32" y="458" width="336" height="150" rx="12" class="surface" stroke="#2a78d6"/>
  <rect x="32" y="458" width="336" height="4" rx="2" fill="#2a78d6" stroke="none"/>
  <text x="48" y="486" class="tb">1 · RAG</text>
  <text x="48" y="508" class="ts">similarity_search(k=8)  →  generate</text>
  <text x="48" y="530" class="tm">One retrieval. No graph. No second look.</text>
  <text x="48" y="548" class="tm">Breaks when the answer needs 10–43 documents</text>
  <text x="48" y="564" class="tm">at once, or an exact count.</text>
  <text x="48" y="590" class="tm">2 LLM calls · fixed cost</text>

  <rect x="422" y="458" width="336" height="150" rx="12" class="surface" stroke="#eb6834"/>
  <rect x="422" y="458" width="336" height="4" rx="2" fill="#eb6834" stroke="none"/>
  <text x="438" y="486" class="tb">2 · GraphRAG</text>
  <text x="438" y="508" class="ts">extract entities → fixed graph pass → generate</text>
  <text x="438" y="530" class="tm">Structure-aware, but the retrieval sequence is</text>
  <text x="438" y="546" class="tm">the same for every question — it never reacts</text>
  <text x="438" y="562" class="tm">to what came back.</text>
  <text x="438" y="590" class="tm">2 LLM calls · fixed cost</text>

  <rect x="812" y="458" width="336" height="150" rx="12" class="surface" stroke="#1baf7a"/>
  <rect x="812" y="458" width="336" height="4" rx="2" fill="#1baf7a" stroke="none"/>
  <text x="828" y="486" class="tb">3 · Agentic GraphRAG</text>
  <text x="828" y="508" class="ts">route → plan → act → evaluate → re-plan → answer</text>
  <text x="828" y="530" class="tm">The orchestrator picks each next action from the</text>
  <text x="828" y="546" class="tm">evidence it already has. Escalates strategy when</text>
  <text x="828" y="562" class="tm">a cheap path returns nothing.</text>
  <text x="828" y="590" class="tm">3–9 LLM calls · budgeted</text>

  <!-- AGENT LOOP DETAIL -->
  <rect x="812" y="626" width="336" height="106" rx="10" class="panel"/>
  <text x="828" y="650" class="hdr">AGENT HARNESS</text>
  <text x="828" y="672" class="ts">state · tool registry · evidence ledger · trace</text>
  <text x="828" y="692" class="ts">budgets: steps / tokens / time / no-progress</text>
  <text x="828" y="712" class="ts">specialists: router · linker · traversal · aggregation</text>
  <text x="828" y="728" class="ts">multi-hop · similarity · evaluator · answerer</text>
  <path d="M980 608 L980 622" class="lnag" marker-end="url(#ag)"/>

  <!-- BENCHMARK -->
  <rect x="32" y="626" width="726" height="106" rx="10" class="panel"/>
  <text x="48" y="650" class="hdr">BENCHMARK &amp; METRICS DASHBOARD</text>
  <text x="48" y="672" class="ts">150 questions (100 public + 50 held out) × 3 pipelines, identical corpus and answer contract</text>
  <text x="48" y="692" class="ts">accuracy (exact + LLM-as-judge) · completeness (gold-doc recall) · citation precision</text>
  <text x="48" y="712" class="ts">tokens in/out per step · LLM calls · latency · steps · strategy changes · stop reason</text>
  <text x="48" y="728" class="tm">headline efficiency metric: accuracy per 1,000 tokens, reported per question type</text>

  <line x1="200" y1="608" x2="200" y2="622" class="ln" marker-end="url(#a)"/>
  <line x1="590" y1="608" x2="590" y2="622" class="ln" marker-end="url(#a)"/>
  <line x1="200" y1="406" x2="200" y2="454" class="ln" marker-end="url(#a)"/>
  <line x1="590" y1="406" x2="590" y2="454" class="ln" marker-end="url(#a)"/>
  <line x1="980" y1="406" x2="980" y2="454" class="lnag" marker-end="url(#ag)"/>
</svg>
